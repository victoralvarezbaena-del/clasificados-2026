<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clasificados a la Fase Estatal · Muestra Cívico-Deportiva 2026</title>
<style>
:root{
  --verde:#08713d; --verde-osc:#05512b; --verde-claro:#e8f3ec; --linea:#d9e6dd;
  --tinta:#16302a; --suave:#5d7268; --fondo:#f4f7f5; --blanco:#fff; --oro:#c99a1e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tinta);background:var(--fondo);line-height:1.4}
header{background:var(--verde);color:#fff;padding:28px 20px 22px}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin:0 0 6px;font-weight:600}
h1{margin:0;font-size:clamp(24px,4vw,38px);line-height:1.1;font-weight:800;letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:18px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1}
.stat span{font-size:13px;opacity:.85}
nav.tabs{background:var(--verde-osc)}
nav.tabs .wrap{display:flex;gap:4px;padding:0 12px}
.tab{appearance:none;border:0;background:none;color:#cfe5d7;font:inherit;font-weight:700;font-size:15px;padding:13px 16px;cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--oro)}
.tab:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
main{padding:18px 16px 40px}
.controls{position:sticky;top:0;z-index:5;background:var(--fondo);padding:12px 0 10px;border-bottom:1px solid var(--linea);margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;position:relative}
.search input,select{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #bcd2c4;border-radius:10px;background:#fff;color:var(--tinta)}
select{flex:0 1 220px;width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.chip{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;border:1px solid #bcd2c4;background:#fff;color:var(--verde-osc);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}
.count{font-size:13px;color:var(--suave);margin-top:6px}
section.disc{margin-top:22px}
.disc h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:20px;font-weight:800}
.disc h2 .rama{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--verde-claro);color:var(--verde-osc)}
.disc h2 .rama.fem{background:#f6e9f0;color:#7a2752}
.disc h2 .n{font-size:13px;font-weight:600;color:var(--suave)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:12px 10px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.card img{width:96px;height:96px;object-fit:contain}
.card .code{font-weight:800;font-size:15px}
.card .name{font-size:13.5px;line-height:1.25}
.card .zona{font-size:11.5px;color:var(--suave);margin-top:auto}
.card .pos{font-size:11px;font-weight:800;color:var(--oro);letter-spacing:.04em}
.macro{margin-top:26px;padding-top:4px}
.macro > h2{font-size:22px;margin:0 0 4px;color:var(--verde-osc)}
.macro > p{margin:0 0 6px;color:var(--suave);font-size:14px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:10px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.lista{background:#fff;border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.lista h3{margin:0;padding:11px 14px;font-size:15px;background:var(--verde-claro);color:var(--verde-osc)}
.lista h3.fem{background:#f6e9f0;color:#7a2752}
.lista ol{margin:0;padding:0;list-style:none}
.lista li{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid #edf2ee;font-size:14px}
.lista li .p{flex:0 0 26px;height:26px;border-radius:50%;background:#eef3f0;font-weight:800;font-size:12.5px;display:grid;place-items:center;color:var(--verde-osc)}
.lista li:nth-child(1) .p{background:#f5e3a8;color:#6d5200}
.lista li img{width:40px;height:40px;object-fit:contain;flex:0 0 40px}
.lista li .t{display:flex;flex-direction:column}
.lista li small{color:var(--suave);font-size:12px}
.empty{padding:40px 10px;text-align:center;color:var(--suave)}
footer{font-size:12.5px;color:var(--suave);text-align:center;padding:10px 16px 28px}
[hidden]{display:none!important}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
  .card img{width:78px;height:78px}
  select{flex:1 1 100%}
}
</style>
</head>

<header>
  <div class="wrap">
    <p class="eyebrow">Colegio de Bachilleres del Estado de San Luis Potosí</p>
    <h1>Clasificados a la Fase Estatal<br>XLII Muestra Cívico-Deportiva 2026</h1>
    <div class="stats" id="stats"></div>

    <button class="tab" role="tab" id="t-aje" aria-selected="false" aria-controls="p-aje">Ajedrez</button>
  </div>
</nav>
<main class="wrap">
  <div id="p-dep" role="tabpanel" aria-labelledby="t-dep">
    <div class="controls">
      <div class="row">
        <div class="search"><input id="q" type="search" placeholder="Buscar plantel o EMSaD (número o nombre)…" aria-label="Buscar plantel o EMSaD"></div>

    </div>
    <div id="dep"></div>
  </div>
  <div id="p-aje" role="tabpanel" aria-labelledby="t-aje" hidden>
    <div id="aje"></div>
  </div>
</main>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const label = c => c.startsWith('PL') ? 'Plantel ' + c.slice(3) : 'EMSaD ' + c.slice(3);
const img = (c, cls='') => `<img src="mascotas/${c}.webp" alt="Mascota de ${label(c)}" loading="lazy" decoding="async" ${cls}>`;

// estadísticas
const planteles = new Set([...DATA.dep.map(d=>d.c), ...DATA.aje.filter(a=>a.c).map(a=>a.c)]);
$('stats').innerHTML = [
  [DATA.dep.length,'equipos en deportes de conjunto'],
  [DATA.aje.length,'clasificados en ajedrez'],
  [planteles.size,'planteles y EMSaD con clasificados']
].map(([n,t])=>`<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('');

// filtros
const discs = [...new Set(DATA.dep.map(d => d.d))];
let activeDisc = '';
$('chips').innerHTML = ['Todas', ...discs].map((d,i) =>
  `<button class="chip" aria-pressed="${i===0}" data-d="${i===0?'':esc(d)}">${esc(d)}</button>`).join('');
$('zona').innerHTML = '<option value="">Todas las zonas</option>' + DATA.zonas.map(z=>`<option>${esc(z)}</option>`).join('');
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  activeDisc = b.dataset.d;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  renderDep();
});
$('q').addEventListener('input', renderDep);
$('zona').addEventListener('change', renderDep);

function match(d, q){
  if (!q) return true;
  const m = q.match(/^([a-z\s.-]*?)\s*-?\s*(\d{1,2})$/);
  if (m) {
    const pre = m[1].trim();
    if (parseInt(d.c.slice(3), 10) !== parseInt(m[2], 10)) return false;
    if (/^(e|em|ems|emsa|emsad|ce|c)$/.test(pre)) return d.c.startsWith('CE');
    if (/^(p|pl|pla|plan|plant|plante|plantel|cobach)$/.test(pre)) return d.c.startsWith('PL');
    return pre === '';
  }
  return norm(`${label(d.c)} ${d.n} ${d.z}`).includes(q);
}

function renderDep(){
  const q = norm($('q').value.trim()), z = $('zona').value;
  const list = DATA.dep.filter(d => (!activeDisc || d.d === activeDisc) && (!z || d.z === z) && match(d, q));
  const groups = [];
  for (const d of list){
    const k = d.d + '|' + d.r;
    let g = groups.find(x => x.k === k);
    if (!g) groups.push(g = {k, d: d.d, r: d.r, items: []});
    g.items.push(d);
  }
  $('count').textContent = list.length === DATA.dep.length ? `${list.length} equipos` : `${list.length} de ${DATA.dep.length} equipos`;
  $('dep').innerHTML = groups.length ? groups.map(g => `
    <section class="disc">
      <h2>${esc(g.d)} ${g.r !== 'Única' ? `<span class="rama ${g.r==='Femenil'?'fem':''}">${esc(g.r)}</span>` : ''}<span class="n">${g.items.length} equipos</span></h2>
      <div class="grid">${g.items.map(d => `
        <article class="card">
          ${img(d.c)}
          <div class="code">${esc(label(d.c))}</div>
          <div class="name">${esc(d.n)}</div>
          <div class="zona">${esc(d.z)}</div>
        </article>`).join('')}
      </div>
    </section>`).join('') : '<p class="empty">No hay clasificados que coincidan con la búsqueda.</p>';
}

function renderAje(){
  const macros = [...new Set(DATA.aje.map(a => a.m))];
  const cats = [['Ajedrez individual','Varonil'],['Ajedrez individual','Femenil'],['Ajedrez por equipos','Varonil'],['Ajedrez por equipos','Femenil']];
  $('aje').innerHTML = macros.map(m => `
    <section class="macro">
      <h2>Macroregión ${esc(m)}</h2>
      <div class="cols">${cats.map(([c,r]) => {
        const items = DATA.aje.filter(a => a.m === m && a.k === c && a.r === r).sort((a,b)=>a.p-b.p);
        if (!items.length) return '';
        return `<div class="lista"><h3 class="${r==='Femenil'?'fem':''}">${c.replace('Ajedrez ','').replace(/^./,x=>x.toUpperCase())} · ${r}</h3><ol>${
          items.map(a => `<li><span class="p">${a.p}</span>${a.c ? img(a.c) : ''}<span class="t">${a.c ? `<b>${esc(label(a.c))} ${esc(a.n)}</b><small>${esc(a.z)}</small>` : esc(a.n)}</span></li>`).join('')
        }</ol></div>`;
      }).join('')}</div>
    </section>`).join('');
}

// pestañas
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); $(x.getAttribute('aria-controls')).hidden = !on; });
}));

renderDep(); renderAje();
</script>
